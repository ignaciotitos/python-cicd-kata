repos:

- repo: local
  hooks:
    - id: ruff-check
      name: ruff (linter)
      entry: uv run ruff check --fix
      language: system
      types: [python]


    - id: ruff-format
      name: ruff (formatter)
      entry: uv run ruff format
      language: system
      types: [python]


    - id: pyright
      name: pyright (tipos)
      entry: uv run pyright
      language: system
      types: [python]
      pass_filenames: false


    - id: pytest
      name: pytest (tests)
      entry: uv run pytest
      language: system
      pass_filenames: false
      stages: [pre-push]